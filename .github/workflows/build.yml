name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: dotnet test tests/MntWatch.Tests -c Release

      - name: Build
        run: dotnet build src/MntWatch -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/MntWatch/bin/Release/net48/MntWatch.exe dist/
          $hash = (Get-FileHash dist/MntWatch.exe -Algorithm SHA256).Hash.ToLower()
          # LF line ending so `sha256sum -c` works on Linux, macOS and Git Bash.
          [IO.File]::WriteAllText("$PWD/dist/MntWatch.exe.sha256", "$hash  MntWatch.exe`n")
          Get-Content dist/MntWatch.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: MntWatch
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/MntWatch.exe dist/MntWatch.exe.sha256 `
            --title "MntWatch ${{ github.ref_name }}" --notes-file .github/release-notes.md
